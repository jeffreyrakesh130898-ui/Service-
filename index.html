<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C2126">
<meta name="description" content="HookCalc: crane and rigging calculator. Crane capacity, sling tension, load weight, boom and radius, ground bearing, wind check and a lift plan you can share.">
<title>HookCalc: Crane &amp; Rigging Calculator</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HookCalc">
<style>/* HookCalc styles. Concept: crane cab instrument panel and hazard signage.
   Colour tokens are injected by build.py (light, dark, fixed). */
:root{--bg:#E6EAED;--surface:#FFFFFF;--surface-2:#F1F4F6;--line:#D2D9DF;--line-2:#B6C0C8;--text:#14181C;--muted:#525D67;--faint:#87919A;--accent:#F7B500;--accent-hi:#FFC42E;--on-accent:#14181C;--steel:#3D5A73;--link:#1F5785;--ok:#16824A;--warn:#9A5700;--bad:#BF1B33;--ok-bg:#DCF1E4;--warn-bg:#FBEBCD;--bad-bg:#FADCE0;--info-bg:#E2E8ED;--sel-bg:#1C2126;--sel-text:#FFFFFF;--sel-ic:#F7B500;--focus:#1A66C9;--cab:#1C2126;--cab-2:#262D33;--cab-line:#353E46;--cab-text:#F1F3F5;--cab-dim:#A6B1BA;color-scheme:light;--ro-bg:#0F1316;--ro-line:#283037;--ro-text:#E9EDF0;--ro-dim:#8E9AA5;--ro-num:#F7B500;--ro-ok:#2FC27A;--ro-warn:#F6A21A;--ro-bad:#F2445A;--ro-stop:#D7263D;--font:"Barlow","Noto Sans Devanagari","Noto Sans Tamil","Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;--font-c:"Barlow Condensed","Noto Sans Devanagari","Noto Sans Tamil","Roboto Condensed","Arial Narrow",sans-serif-condensed,"Segoe UI",Roboto,sans-serif;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#101417;--surface:#191E23;--surface-2:#20262C;--line:#2B333A;--line-2:#3A444D;--text:#ECEFF2;--muted:#A3AEB8;--faint:#76818B;--steel:#8FB2D1;--link:#8DC2F2;--ok:#46CF8B;--warn:#F4AA33;--bad:#FF6577;--ok-bg:#12301F;--warn-bg:#352812;--bad-bg:#3D1720;--info-bg:#1E252B;--sel-bg:#F7B500;--sel-text:#14181C;--sel-ic:#14181C;--focus:#F7B500;--cab:#1A2025;--cab-2:#232A30;--cab-line:#323B43;--cab-text:#F1F3F5;--cab-dim:#A6B1BA;color-scheme:dark;}}
:root[data-theme="dark"],:root.hc-dark{--bg:#101417;--surface:#191E23;--surface-2:#20262C;--line:#2B333A;--line-2:#3A444D;--text:#ECEFF2;--muted:#A3AEB8;--faint:#76818B;--steel:#8FB2D1;--link:#8DC2F2;--ok:#46CF8B;--warn:#F4AA33;--bad:#FF6577;--ok-bg:#12301F;--warn-bg:#352812;--bad-bg:#3D1720;--info-bg:#1E252B;--sel-bg:#F7B500;--sel-text:#14181C;--sel-ic:#14181C;--focus:#F7B500;--cab:#1A2025;--cab-2:#232A30;--cab-line:#323B43;--cab-text:#F1F3F5;--cab-dim:#A6B1BA;color-scheme:dark;}
:root.hc-light{--bg:#E6EAED;--surface:#FFFFFF;--surface-2:#F1F4F6;--line:#D2D9DF;--line-2:#B6C0C8;--text:#14181C;--muted:#525D67;--faint:#87919A;--accent:#F7B500;--accent-hi:#FFC42E;--on-accent:#14181C;--steel:#3D5A73;--link:#1F5785;--ok:#16824A;--warn:#9A5700;--bad:#BF1B33;--ok-bg:#DCF1E4;--warn-bg:#FBEBCD;--bad-bg:#FADCE0;--info-bg:#E2E8ED;--sel-bg:#1C2126;--sel-text:#FFFFFF;--sel-ic:#F7B500;--focus:#1A66C9;--cab:#1C2126;--cab-2:#262D33;--cab-line:#353E46;--cab-text:#F1F3F5;--cab-dim:#A6B1BA;color-scheme:light;}

*,*::before,*::after{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:400 16px/1.5 var(--font);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-c);font-weight:700;line-height:1.1;margin:0;letter-spacing:.005em}
p{margin:0 0 12px}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:22px;height:22px;flex:none}
.skip{position:absolute;left:8px;top:-80px;z-index:100;background:var(--accent);color:var(--on-accent);padding:10px 14px;border-radius:8px;font-weight:700;text-decoration:none}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 8px)}
.statusfill{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--cab);z-index:60}

/* ---------- shell ---------- */
.shell{min-height:100vh}
.side{display:none}
.main{min-width:0}
#view{display:block;outline:none;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.page{max-width:1120px;margin:0 auto;padding:18px 16px 24px}
.lede{color:var(--muted);margin:0;max-width:60ch}
.foot{margin:30px 0 0;color:var(--muted);font-size:14px;max-width:70ch}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:6px;min-height:58px;padding:6px 10px;background:var(--cab);color:var(--cab-text)}
.bar-t{font:700 23px/1.1 var(--font-c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar-back{display:grid;place-items:center;width:44px;height:44px;border-radius:10px;color:var(--cab-text);flex:none}
.bar-back:hover{background:var(--cab-2)}
.bar-ic{display:grid;place-items:center;color:var(--accent);flex:none}
.bar-sp{flex:1}
.brand{display:inline-flex;align-items:center;gap:8px;color:var(--cab-text);text-decoration:none;font:800 26px/1 var(--font-c);letter-spacing:.01em;padding:4px 6px}
.hook{width:30px;height:30px;color:var(--accent);flex:none;--hook-hole:var(--cab)}

/* units toggle */
.useg{display:inline-flex;padding:3px;gap:2px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line)}
.useg button{border:0;background:transparent;min-height:38px;padding:0 12px;border-radius:8px;font:700 15px/1 var(--font-c);letter-spacing:.01em;color:var(--muted)}
.useg button[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-text)}
.useg-bar{background:var(--cab-2);border-color:var(--cab-line)}
.useg-bar button{color:var(--cab-dim)}
.useg-bar button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

/* ---------- bottom tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:45;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;color:var(--muted);text-decoration:none;font:600 14px/1.1 var(--font-c);letter-spacing:.01em}
.tabs a .ic{width:24px;height:24px}
.tabs a[aria-current="page"]{color:var(--text)}
.tabs a[aria-current="page"]::before{content:"";position:absolute;top:0;left:26%;right:26%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
body[data-view="tool"] .tabs{display:none}

/* ---------- readout bar (mobile tool pages) ---------- */
.rbar{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 62%,rgba(0,0,0,0));transition:transform .25s ease,opacity .25s ease}
.rbar.rbar-off{transform:translateY(115%);opacity:0;pointer-events:none}
.rbar-in{width:100%;display:flex;align-items:center;gap:12px;min-height:62px;padding:8px 12px 8px 16px;border:1px solid var(--ro-line);border-radius:15px;background:var(--ro-bg);color:var(--ro-text);text-align:left;box-shadow:0 12px 26px -12px rgba(0,0,0,.6)}
.rb-dot{width:12px;height:12px;border-radius:50%;background:var(--ro-dim);flex:none}
.rb-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.rb-l{font:600 14px/1.2 var(--font-c);color:var(--ro-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-v{font:700 27px/1.05 var(--font-c);color:var(--ro-num);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-s{flex:none;font:700 15px/1 var(--font-c);padding:8px 10px;border-radius:8px;background:#232A30;color:var(--ro-text)}
.rb-s:empty{display:none}
.rbar[data-s="ok"] .rb-dot{background:var(--ro-ok)}.rbar[data-s="ok"] .rb-s{background:var(--ro-ok);color:#052313}
.rbar[data-s="warn"] .rb-dot{background:var(--ro-warn)}.rbar[data-s="warn"] .rb-s{background:var(--ro-warn);color:#2A1700}
.rbar[data-s="bad"] .rb-dot{background:var(--ro-bad)}.rbar[data-s="bad"] .rb-s{background:var(--ro-bad);color:#fff}
.rbar[data-s="stop"] .rb-dot{background:var(--ro-stop)}.rbar[data-s="stop"] .rb-s{background:var(--ro-stop);color:#fff}
.rbar[data-s="stop"] .rb-v,.rbar[data-s="bad"] .rb-v{color:#FF6B7D}
.rbar[data-s="empty"] .rb-v,.rbar[data-s="error"] .rb-v{color:#56616A}

/* ---------- calculator layout ---------- */
.tool-intro{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.tool-acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tool-acts .useg{margin-left:auto}
.tool-grid{display:grid;gap:24px}
.inputs,.results{min-width:0}
.results{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 70px)}

/* fields */
.fld{margin:0 0 18px}
.fld>label,.lbl{display:block;font:600 17px/1.25 var(--font-c);letter-spacing:.01em;color:var(--text);margin:0 0 7px}
.opt{font:500 14px var(--font);color:var(--faint);margin-left:4px;letter-spacing:0}
.inp{display:flex;align-items:stretch;min-height:54px;background:var(--surface);border:1.5px solid var(--line-2);border-radius:11px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.inp:focus-within{border-color:var(--text);box-shadow:0 0 0 3px rgba(247,181,0,.55)}
.inp input{flex:1;min-width:0;width:100%;border:0;background:transparent;padding:12px 14px;font:600 21px/1.2 var(--font);font-variant-numeric:tabular-nums;color:var(--text);outline:none}
.inp input::placeholder{color:var(--faint);font-weight:400;opacity:1}
.inp .u{display:flex;align-items:center;padding:0 13px;background:var(--surface-2);border-left:1px solid var(--line);color:var(--muted);font:700 17px/1 var(--font-c);white-space:nowrap}
.sign{flex:none;width:44px;border:0;border-right:1px solid var(--line);background:var(--surface-2);color:var(--muted);font:700 20px/1 var(--font)}
.has-err .inp{border-color:var(--bad)}
.errmsg{margin:6px 0 0;color:var(--bad);font-weight:600;font-size:15px}
.hint{margin:6px 0 0;color:var(--muted);font-size:15px;line-height:1.45;max-width:62ch}
.fnote{color:var(--muted);font-size:15px;line-height:1.45;margin:-6px 0 18px;max-width:62ch}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grp{margin:28px 0 14px;padding-top:16px;border-top:2px solid var(--line)}
.grp h2{font-size:21px}
.grp .hint{margin-top:4px}
.grp-first{margin-top:0;padding-top:0;border-top:0}

/* segmented controls and tiles */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 0;min-width:max-content;min-height:48px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line-2);background:var(--surface);color:var(--text);font:600 17px/1.15 var(--font-c);letter-spacing:.01em}
.seg button[aria-pressed="true"],.tiles button[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-text);box-shadow:inset 0 -4px 0 var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tiles button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:76px;padding:8px 4px;border-radius:10px;border:1.5px solid var(--line-2);background:var(--surface);color:var(--text);font:600 14px/1.1 var(--font-c);text-align:center;letter-spacing:.01em}
.tiles button .ic{width:28px;height:28px;color:var(--steel)}
.tiles button[aria-pressed="true"] .ic{color:var(--sel-ic)}
.tiles-txt button{min-height:52px;font-size:16px}

/* select */
.selwrap{position:relative}
.selwrap select{width:100%;min-height:54px;-webkit-appearance:none;appearance:none;border:1.5px solid var(--line-2);border-radius:11px;background:var(--surface);color:var(--text);padding:0 44px 0 14px;font:600 17px/1.2 var(--font)}
.selwrap::after{content:"";position:absolute;right:18px;top:50%;width:9px;height:9px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:11px;border:1.5px solid var(--line-2);background:var(--surface);color:var(--text);font:700 17px/1.1 var(--font-c);letter-spacing:.01em;text-decoration:none;text-align:center}
.btn:hover{border-color:var(--text)}
.btn .ic{width:20px;height:20px}
.btn-sm{min-height:42px;padding:0 12px;font-size:16px}
.btn-lg{min-height:56px;padding:0 22px;font-size:19px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
.btn-quiet{background:transparent;border-color:transparent;color:var(--muted)}
.btn-quiet:hover{color:var(--text);border-color:var(--line-2)}
.btn-danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn-danger-t{color:var(--bad)}
.btn-wa{background:#1E8E4E;border-color:#1E8E4E;color:#fff}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);flex:none}
.icon-btn:hover{border-color:var(--line-2);color:var(--text)}

/* ---------- instrument readout ---------- */
.readout{background:var(--ro-bg);color:var(--ro-text);border:1px solid var(--ro-line);border-radius:16px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 14px 30px -20px rgba(0,0,0,.7)}
.readout+.readout{margin-top:12px}
.ro-head{padding:14px 18px 0}
.ro-lbl{font:600 16px/1.2 var(--font-c);color:var(--ro-dim);letter-spacing:.01em}
.ro-main{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;padding:2px 18px 14px}
.ro-num{font:700 clamp(52px,15vw,68px)/.95 var(--font-c);color:var(--ro-num);font-variant-numeric:tabular-nums;letter-spacing:-.005em}
.ro-unit{font:700 24px/1 var(--font-c);color:var(--ro-dim)}
.ro-text .ro-num{font-size:clamp(36px,10.5vw,50px);line-height:1}
.ro-sub .ro-num{font-size:clamp(40px,11vw,52px)}
.ro-verdict{display:flex;align-items:flex-start;gap:10px;margin:0;padding:12px 18px;font:700 18px/1.25 var(--font-c);letter-spacing:.01em;background:#20272D;color:var(--ro-text)}
.ro-verdict .ic{width:22px;height:22px;margin-top:1px}
[data-s="ok"]>.ro-verdict{background:var(--ro-ok);color:#052313}
[data-s="warn"]>.ro-verdict{background:var(--ro-warn);color:#2A1700}
[data-s="bad"]>.ro-verdict{background:var(--ro-bad);color:#fff}
[data-s="stop"]>.ro-verdict{color:#fff;padding:19px 18px;background-color:var(--ro-stop);background-image:repeating-linear-gradient(-45deg,#F7B500 0 9px,#15191D 9px 18px),repeating-linear-gradient(-45deg,#F7B500 0 9px,#15191D 9px 18px);background-size:100% 7px,100% 7px;background-position:top,bottom;background-repeat:no-repeat;animation:hc-pulse 1.4s ease-in-out infinite}
[data-s="empty"]>.ro-verdict,[data-s="error"]>.ro-verdict{background:#1A2025;color:var(--ro-dim);font-weight:600}
[data-s="error"]>.ro-verdict{color:#FFB3BD}
.readout[data-s="stop"] .ro-num,.readout[data-s="bad"] .ro-num{color:#FF6B7D}
.readout[data-s="empty"] .ro-num,.readout[data-s="error"] .ro-num{color:#4A555E}
@keyframes hc-pulse{50%{background-color:#A01427}}
.ro-rows{margin:0;padding:6px 18px 14px}
.ro-row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:9px 0;border-top:1px solid var(--ro-line)}
.ro-row:first-child{border-top:0}
.ro-row dt{color:var(--ro-dim);font-size:15px;line-height:1.3}
.ro-row dd{margin:0;text-align:right;font:700 18px/1.25 var(--font-c);font-variant-numeric:tabular-nums}
.ro-row[data-s="ok"] dd{color:var(--ro-ok)}
.ro-row[data-s="warn"] dd{color:var(--ro-warn)}
.ro-row[data-s="bad"] dd,.ro-row[data-s="stop"] dd{color:#FF6B7D}

/* gauge */
.gauge{display:block;width:100%;max-width:340px;height:auto;margin:0 auto}
.gauge .gz{fill:none;stroke-width:18}
.gauge .gz-ok{stroke:var(--ro-ok)}.gauge .gz-warn{stroke:var(--ro-warn)}.gauge .gz-bad{stroke:var(--ro-bad)}
.gauge .gt{stroke:var(--ro-bg);stroke-width:2.5}
.gauge .gl{fill:var(--ro-dim);font:600 12px var(--font-c)}
.gauge .needle{transform-origin:120px 116px;transition:transform .55s cubic-bezier(.2,.9,.25,1.05)}
.gauge .needle path,.gauge .hub{fill:#F2F4F6}
.gauge .hub{stroke:var(--ro-bg);stroke-width:3}

/* figures and diagrams */
.fig{margin:12px 0 0;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.fig-dark{background:var(--ro-bg);border-color:var(--ro-line)}
.fig figcaption{margin-top:6px;font-size:14px;color:var(--muted)}
.dia{display:block;width:100%;height:auto;max-height:360px;margin:0 auto;overflow:visible}
.dia .d-txt{font:600 13px var(--font-c);fill:var(--text);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.dia .d-strong{font-weight:700;font-size:14px}
.dia .d-num{fill:#fff;stroke:none;font-weight:700}
.d-load,.d-loadb{fill:var(--surface-2);stroke:var(--steel);stroke-width:2}
.d-leg{stroke:var(--steel);stroke-width:3.5;stroke-linecap:round}
.d-leg[data-s="ok"]{stroke:var(--ok)}.d-leg[data-s="warn"]{stroke:var(--warn)}.d-leg[data-s="stop"],.d-leg[data-s="bad"]{stroke:var(--bad)}
.d-pin{fill:var(--surface);stroke:var(--text);stroke-width:2}
.d-block{fill:var(--cab);stroke:var(--text);stroke-width:1}
.d-sheave{fill:var(--accent)}
.d-rope,.d-rig{stroke:var(--text);stroke-width:1.8;fill:none}
.d-ring{fill:none;stroke:var(--text);stroke-width:2.5}
.d-arc{fill:none;stroke:var(--text);stroke-width:1.5}
.d-cg circle{fill:var(--surface);stroke:var(--text);stroke-width:1.8}.d-cg path{fill:var(--text)}
.d-ground{stroke:var(--text);stroke-width:2}
.d-hatch{stroke:var(--line-2);stroke-width:1.4}
.d-carrier,.d-cab{fill:var(--steel)}
.d-wheel{fill:var(--cab);stroke:var(--surface);stroke-width:1.5}
.d-boom-o{stroke:var(--text);stroke-width:10;stroke-linecap:round}
.d-boom{stroke:var(--accent);stroke-width:6;stroke-linecap:round}
.d-axis{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 4;fill:none}
.d-dimline{stroke:var(--muted);stroke-width:1.4;fill:none}
.d-obs{fill:var(--info-bg);stroke:var(--muted);stroke-width:1.5}
.d-obs[data-s="ok"]{stroke:var(--ok)}.d-obs[data-s="warn"]{fill:var(--warn-bg);stroke:var(--warn)}.d-obs[data-s="stop"]{fill:var(--bad-bg);stroke:var(--bad)}
.d-clr{stroke-width:2.5;stroke:var(--muted)}
.d-clr[data-s="ok"]{stroke:var(--ok)}.d-clr[data-s="warn"]{stroke:var(--warn)}.d-clr[data-s="stop"]{stroke:var(--bad)}
.d-set{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1.5}
.d-item{fill:var(--steel)}
.d-beam{stroke:var(--text);stroke-width:4;stroke-linecap:round}
.d-lift{stroke:var(--text);stroke-width:2}
.d-lift-h{fill:var(--text)}
.d-mat{fill:var(--surface-2);stroke:var(--text);stroke-width:2}
.d-need{fill:none;stroke:var(--steel);stroke-width:2;stroke-dasharray:6 5}
.d-need[data-s="ok"]{stroke:var(--ok)}.d-need[data-s="warn"]{stroke:var(--warn)}.d-need[data-s="stop"]{stroke:var(--bad)}
.d-float{fill:var(--cab)}
.d-bar-bg{fill:var(--surface-2)}
.d-z-ok{fill:var(--ok);opacity:.55}.d-z-warn{fill:var(--warn);opacity:.65}.d-z-stop{fill:var(--bad);opacity:.6}
.d-limit{stroke:var(--text);stroke-width:2.5}
.d-marker{fill:var(--text)}
.d-hookp{fill:none;stroke:var(--text);stroke-width:3;stroke-linecap:round}

/* notes, tips, actions */
.notes{list-style:none;margin:14px 0 0;padding:0}
.notes li{position:relative;margin-top:8px;padding:11px 12px 11px 40px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:15px;line-height:1.45}
.notes li::before{content:"!";position:absolute;left:12px;top:11px;width:19px;height:19px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:800 13px/19px var(--font);text-align:center}
.res-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.res-acts .btn{flex:1 1 auto}
.tips{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.tips h3{font-size:18px;margin-bottom:6px}
.tips ul{margin:0;padding-left:20px;color:var(--muted);font-size:15px;line-height:1.45}
.tips li+li{margin-top:6px}
.tblw{overflow-x:auto;margin:10px 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
.tbl thead th{border-top:0;background:var(--surface-2);font:700 15px/1.2 var(--font-c);letter-spacing:.01em}
.tbl .num{text-align:right}
.tbl .wrap{white-space:normal;min-width:150px}
.tbl tr.hi td{background:var(--warn-bg);font-weight:700}
.tbl tr[data-s="stop"] td{color:var(--bad);font-weight:700}
.tbl tr[data-s="warn"] td{color:var(--warn)}
.sw{display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:-3px;margin-right:9px;border:1px solid rgba(0,0,0,.25)}

/* CG item list */
.cgl{display:grid;gap:10px}
.cgi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 2px}
.cgi-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cgi-n{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--steel);color:#fff;font:700 15px/1 var(--font-c);flex:none}
.cgi-name{flex:1;min-width:0;min-height:44px;border:1.5px solid var(--line-2);border-radius:10px;background:var(--surface);padding:8px 12px;font:600 17px/1.2 var(--font)}
.cgi-name:focus{outline:none;border-color:var(--text);box-shadow:0 0 0 3px rgba(247,181,0,.55)}
.cgi-vals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}
.mfld{margin:0 0 10px}
.mfld label{display:block;font:600 15px/1.2 var(--font-c);color:var(--muted);margin-bottom:5px}
.inp-sm{min-height:48px}
.inp-sm input{font-size:19px;padding:10px}
.inp-sm .u{padding:0 10px}
.inp-sm .sign{width:38px}
.cg-tools{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin:12px 0 4px}

/* checkboxes */
.chk{display:flex;align-items:flex-start;gap:12px;cursor:pointer;line-height:1.35}
.chk input{-webkit-appearance:none;appearance:none;flex:none;width:26px;height:26px;margin:0;border:2px solid var(--line-2);border-radius:7px;background:var(--surface);display:grid;place-items:center;cursor:pointer}
.chk input::after{content:"";width:7px;height:13px;border:solid var(--on-accent);border-width:0 3px 3px 0;transform:translate(0,-1px) rotate(45deg);opacity:0}
.chk input:checked{background:var(--accent);border-color:var(--accent)}
.chk input:checked::after{opacity:1}
.chk input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* ---------- home ---------- */
.hero{background:var(--cab);color:var(--cab-text);padding:6px 16px 22px;border-bottom:4px solid var(--accent)}
.hero-in{max-width:1120px;margin:0 auto;display:grid;gap:18px}
.hero h1{font:800 clamp(36px,10vw,58px)/.96 var(--font-c);letter-spacing:-.005em;margin:6px 0 10px;max-width:13ch}
.hero p{color:var(--cab-dim);max-width:46ch;margin-bottom:16px}
.qc{background:var(--ro-bg);border:1px solid var(--ro-line);border-radius:18px;padding:14px 14px 16px}
.qc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.qc h2{font-size:21px;color:var(--ro-text)}
.qc-link{color:var(--accent);font:700 16px var(--font-c);text-decoration:none;padding:8px 4px}
.qc-link:hover{text-decoration:underline}
.qc-in{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qf{margin:0}
.qf>label{color:var(--ro-dim);font-size:15px}
.inp-dark{background:#090C0E;border-color:#36414A}
.inp-dark input{color:#fff}
.inp-dark input::placeholder{color:#5F6B75}
.inp-dark .u{background:#151A1E;border-color:#2A3238;color:var(--ro-dim)}
.qf .errmsg{color:#FF9AA8}
.qc-out{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:center;gap:4px 12px;margin-top:12px;color:var(--ro-text)}
.qc-g svg{display:block;width:100%;height:auto}
.qc-num{display:flex;align-items:baseline;gap:4px}
.qc-num .ro-num{font-size:clamp(46px,14vw,66px)}
.qc-out .ro-verdict{grid-column:1/-1;border-radius:10px;margin-top:4px}
.qc-note{grid-column:1/-1;margin:2px 0 0;color:var(--ro-dim);font-size:14px}
.qc-note:empty{display:none}
.qc-out[data-s="stop"] .ro-num,.qc-out[data-s="bad"] .ro-num{color:#FF6B7D}
.qc-out[data-s="empty"] .ro-num,.qc-out[data-s="error"] .ro-num{color:#4A555E}
.hsec{margin-top:26px}
.hsec-h{font-size:25px;margin:0 0 12px}
.tlist{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.trow{display:grid;grid-template-columns:46px minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 16px;min-height:74px;color:var(--text);text-decoration:none;border-top:1px solid var(--line);background:var(--surface)}
.trow:first-child{border-top:0}
.trow:hover{background:var(--surface-2)}
.ticon{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--steel)}
.ticon .ic{width:26px;height:26px}
.tname{display:block;font:700 20px/1.15 var(--font-c);letter-spacing:.005em}
.tdesc{display:block;margin-top:2px;color:var(--muted);font-size:15px;line-height:1.35}
.chip{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border-radius:999px;background:var(--info-bg);color:var(--text);font:700 15px/1 var(--font-c);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip[data-s="ok"]{background:var(--ok-bg);color:var(--ok)}
.chip[data-s="warn"]{background:var(--warn-bg);color:var(--warn)}
.chip[data-s="bad"],.chip[data-s="stop"]{background:var(--bad-bg);color:var(--bad)}
.glinks{display:flex;flex-wrap:wrap;gap:8px}
.glink{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--surface);color:var(--text);text-decoration:none;font:600 16px var(--font-c);letter-spacing:.01em}
.glink:hover{border-color:var(--text)}

/* ---------- lift plan ---------- */
.psec{margin-top:28px}
.psec>h2{font-size:23px;margin-bottom:12px}
.pgrid{display:grid;gap:0 14px}
.inp-text input{font:500 18px/1.3 var(--font)}
textarea{display:block;width:100%;min-height:110px;border:1.5px solid var(--line-2);border-radius:11px;background:var(--surface);color:var(--text);padding:12px 14px;font:400 17px/1.45 var(--font);resize:vertical}
textarea:focus{outline:none;border-color:var(--text);box-shadow:0 0 0 3px rgba(247,181,0,.55)}
.pcards{display:grid;gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line-2);border-radius:14px;padding:14px 16px}
.pcard[data-s="ok"]{border-left-color:var(--ok)}.pcard[data-s="warn"]{border-left-color:var(--warn)}.pcard[data-s="bad"],.pcard[data-s="stop"]{border-left-color:var(--bad)}
.pcard.off{opacity:.62}
.pcard header{display:flex;align-items:center;gap:10px}
.pcard h3{flex:1;font-size:20px;min-width:0}
.pc-ic{display:grid;color:var(--steel)}
.pc-v{display:flex;align-items:flex-start;gap:8px;margin:10px 0 4px;font:700 16px/1.3 var(--font-c);letter-spacing:.01em}
.pc-v .ic{width:20px;height:20px}
.pcard[data-s="ok"] .pc-v{color:var(--ok)}.pcard[data-s="warn"] .pc-v{color:var(--warn)}.pcard[data-s="bad"] .pc-v,.pcard[data-s="stop"] .pc-v{color:var(--bad)}
.pcard ul{margin:6px 0 12px;padding-left:18px;color:var(--muted);font-size:15px;line-height:1.45}
.pcard footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.pc-edit{padding:8px 4px;color:var(--link);font:700 16px var(--font-c);text-decoration:none}
.pc-ex{font-size:14px;font-weight:600;color:var(--warn)}
.pempty{padding:18px;background:var(--surface);border:1.5px dashed var(--line-2);border-radius:14px}
.chkg{border:0;margin:0 0 16px;padding:0}
.chkg legend{padding:0;margin-bottom:6px;font:700 19px var(--font-c)}
.chk-lg{min-height:54px;align-items:center;margin-top:8px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pbtns{display:grid;gap:10px}
.pnew{margin-top:14px}
.print-only{display:none}

/* ---------- guide ---------- */
.gsec{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 72px)}
.guide .lede{margin-bottom:6px}
.gsec summary{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px;padding:14px 16px;list-style:none;cursor:pointer;font:700 21px/1.2 var(--font-c);letter-spacing:.005em}
.gsec summary::-webkit-details-marker{display:none}
.gsec summary .ic{color:var(--muted);transition:transform .2s ease}
.gsec[open] summary .ic{transform:rotate(90deg)}
.gbody{padding:0 16px 16px}
.sig{margin:0}
.sig div{padding:10px 0;border-top:1px solid var(--line)}
.sig dt{font:700 18px var(--font-c)}
.sig dd{margin:2px 0 0;color:var(--muted)}
.glist{margin:0;padding-left:20px}
.glist li+li{margin-top:8px}

/* ---------- settings ---------- */
.sset{margin-top:12px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.sset:first-child{margin-top:0}
.sset h2{font-size:21px;margin-bottom:10px}
.sset .hint{margin:0 0 12px}
.sset .seg+.hint{margin:10px 0 0}
.range{display:flex;align-items:center;gap:14px}
.range input{flex:1;height:32px;accent-color:var(--accent)}
.range output{min-width:3.4ch;text-align:right;font:700 26px var(--font-c)}

/* ---------- modal and toast ---------- */
.mback{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px);background:rgba(8,10,12,.62);animation:hc-fade .18s ease}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--surface);color:var(--text);border-radius:20px 20px 0 0;padding:22px 20px calc(18px + env(safe-area-inset-bottom,0px));animation:hc-up .22s ease}
.modal h2{font-size:27px;margin-bottom:12px}
.m-body p{margin:0 0 12px}
.m-body .lbl{margin-top:4px}
.m-acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:18px}
.m-acts .btn{flex:1 1 auto}
.m-warn{display:flex;gap:10px;margin-top:16px!important;padding:12px;border-radius:12px;background:var(--warn-bg);font-size:15px;line-height:1.45}
.m-warn .ic{color:var(--warn);margin-top:1px}
.copybox{min-height:220px;font:400 14px/1.45 var(--font)}
body.modal-open{overflow:hidden}
@keyframes hc-fade{from{opacity:0}}
@keyframes hc-up{from{transform:translateY(24px);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:90;max-width:min(92vw,460px);padding:12px 16px;border-radius:12px;border-left:4px solid var(--accent);background:var(--ro-bg);color:var(--ro-text);font:600 15px/1.35 var(--font);box-shadow:0 14px 30px -12px rgba(0,0,0,.55);opacity:0;pointer-events:none;transform:translate(-50%,16px);transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- tablet ---------- */
@media (min-width:640px){
  .mback{align-items:center;padding:24px}
  .modal{border-radius:20px;padding-bottom:20px}
  .tlist{grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line)}
  .trow{border-top:0}
  .pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pbtns{grid-template-columns:repeat(2,minmax(0,1fr))}
  .page{padding:22px 24px 28px}
  .hero{padding:10px 24px 26px}
}

/* ---------- desktop ---------- */
@media (min-width:980px){
  .shell{display:grid;grid-template-columns:256px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;padding:14px 12px 20px;background:var(--cab);color:var(--cab-text)}
  .side-brand{display:flex;align-items:center;gap:10px;padding:8px 10px 18px;color:var(--cab-text);text-decoration:none;font:800 28px/1 var(--font-c);letter-spacing:.01em}
  .side-brand .hook{width:32px;height:32px}
  .side-nav{display:flex;flex-direction:column;gap:2px}
  .side-nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;color:var(--cab-dim);text-decoration:none;font:600 17px/1.1 var(--font-c);letter-spacing:.01em}
  .side-nav a:hover{background:var(--cab-2);color:var(--cab-text)}
  .side-nav a[aria-current="page"]{background:var(--cab-2);color:var(--cab-text);box-shadow:inset 3px 0 0 var(--accent)}
  .side-nav a .ic{width:20px;height:20px}
  .side-nav a[aria-current="page"] .ic{color:var(--accent)}
  .side-h{margin:18px 12px 6px;font:600 14px var(--font-c);letter-spacing:.02em;color:#7F8B96}
  .tabs,.rbar{display:none!important}
  #view{padding-bottom:40px}
  .bar{min-height:66px;padding:8px 28px;background:var(--bg);color:var(--text);border-bottom:1px solid var(--line)}
  .bar .brand{display:none}
  .bar-back{color:var(--text)}
  .bar-back:hover{background:var(--surface-2)}
  .bar-t{font-size:29px}
  .useg-bar{background:var(--surface-2);border-color:var(--line)}
  .useg-bar button{color:var(--muted)}
  .useg-bar button[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-text)}
  .page{padding:26px 32px 40px}
  .tool-grid{grid-template-columns:minmax(0,1fr) minmax(360px,430px);gap:36px;align-items:start}
  .results{position:sticky;top:88px}
  .hero{padding:30px 32px 34px}
  .hero-in{grid-template-columns:minmax(0,1fr) minmax(400px,1fr);align-items:center;gap:44px}
  .tlist{grid-template-columns:repeat(3,minmax(0,1fr))}
  .trow{grid-template-columns:46px minmax(0,1fr);align-content:start;min-height:128px;padding:18px}
  .trow .chip{grid-column:2;justify-self:start}
  .pbtns{grid-template-columns:repeat(4,auto);justify-content:start}
  .toast{bottom:28px}
}

/* ---------- print (lift plan) ---------- */
@media print{
  @page{margin:14mm}
  :root{padding:0!important}
  body{background:#fff!important;color:#000!important;font-size:11pt}
  .bar,.tabs,.rbar,.side,.statusfill,.toast,.no-print,.skip,.hero,#modal-root,.pc-edit,.res-acts,.tool-acts,.tips{display:none!important}
  .shell{display:block!important}
  #view{padding:0!important}
  .page{max-width:none;padding:0}
  .print-only{display:block!important}
  .ptitle{font-size:24pt;margin-bottom:10px}
  .readout{background:#fff!important;color:#000!important;border:2px solid #000;box-shadow:none}
  .ro-num,.ro-unit,.ro-lbl,.ro-row dt,.ro-row dd{color:#000!important}
  .ro-verdict{background:#fff!important;background-image:none!important;color:#000!important;border-top:2px solid #000;animation:none!important}
  .pcard,.chk-lg,.fld,.chkg{break-inside:avoid}
  .pcard,.chk-lg,.inp,textarea,.tblw{border-color:#000!important;background:#fff!important}
  .pcard.off{display:none}
  .chk input{border:2px solid #000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  a{color:#000;text-decoration:none}
  .psign{display:grid!important;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:40px}
  .psign div{border-top:1px solid #000;padding-top:6px;font-size:10pt}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* ---------- language button and Indian scripts ---------- */
.lang-btn{display:grid;place-items:center;min-width:44px;height:44px;padding:0 10px;margin-right:6px;border-radius:10px;border:1px solid var(--cab-line);background:var(--cab-2);color:var(--cab-text);font:700 16px/1 var(--font-c);flex:none}
.lang-btn:hover{border-color:var(--accent)}
.tiles button span{overflow-wrap:anywhere}
html[lang="hi"] h1,html[lang="hi"] h2,html[lang="hi"] h3,html[lang="ta"] h1,html[lang="ta"] h2,html[lang="ta"] h3{line-height:1.3}
html[lang="hi"] .hero h1{font-size:clamp(30px,8vw,50px);line-height:1.25}
html[lang="ta"] .hero h1{font-size:clamp(25px,6.8vw,42px);line-height:1.35}
html[lang="hi"] .fld>label,html[lang="hi"] .lbl,html[lang="ta"] .fld>label,html[lang="ta"] .lbl{line-height:1.45}
html[lang="hi"] .ro-verdict,html[lang="ta"] .ro-verdict{line-height:1.45}
html[lang="ta"] .ro-verdict{font-size:16px}
html[lang="hi"] .btn,html[lang="ta"] .btn,html[lang="hi"] .seg button,html[lang="ta"] .seg button,html[lang="hi"] .tiles button,html[lang="ta"] .tiles button{line-height:1.3}
html[lang="ta"] .seg button,html[lang="ta"] .tiles button{font-size:14.5px}
html[lang="ta"] .btn{font-size:15.5px}
html[lang="ta"] .tabs a{font-size:12px;text-align:center}
html[lang="hi"] .ro-text .ro-num{font-size:clamp(32px,9vw,46px);line-height:1.25}
html[lang="ta"] .ro-text .ro-num{font-size:clamp(26px,7.5vw,38px);line-height:1.3}
html[lang="hi"] .ro-row dd,html[lang="ta"] .ro-row dd,html[lang="hi"] .tname,html[lang="ta"] .tname{line-height:1.35}
html[lang="ta"] .tname{font-size:18px}
html[lang="ta"] .rb-s,html[lang="ta"] .chip{font-size:13px}
html[lang="hi"] .gsec summary,html[lang="ta"] .gsec summary{line-height:1.4}
html[lang="ta"] .gsec summary{font-size:18px}
@media (min-width:980px){.lang-btn{border-color:var(--line);background:var(--surface-2);color:var(--text)}}
</style>
</head>
<body>
<a class="skip" href="#/" data-act="skip">Skip to content</a>
<div class="statusfill" aria-hidden="true"></div>
<div class="shell">
<aside class="side" id="side"></aside>
<div class="main">
<header class="bar" id="bar"></header>
<main id="view" tabindex="-1"></main>
</div>
</div>
<nav class="tabs" id="tabs" aria-label="Main"></nav>

/* ---------- form engine for calculators ---------- */
function toolCtx() { return VIEW.name === 'tool' && TOOLS[VIEW.id] ? { id: VIEW.id, t: TOOLS[VIEW.id], st: S.tools[VIEW.id] } : null; }
function exampleOf(t, st) { const ex = typeof t.example === 'function' ? t.example(st) : t.example; return ex || { opts: {}, vals: {} }; }
function findField(fields, k) {

    const f = fields[i];

  }
  return null;
}
function renderFields(t, st) {

}

    case 'note': return `<p class="fnote"${w}>${esc(T(lab(f.html, st)))}</p>`;

}

function segHTML(f, st, w, tiles) {

function updateVis() {

let VIEW = { name: 'home' };

function onKey(e) {

      const first = f[0], last = f[f.length - 1];

/* ---------- capacity gauge ---------- */

    arc(0, thr, 'gz-ok') + arc(thr, 90, 'gz-warn') + arc(90, 100, 'gz-bad') + arc(100, 120, 'gz-stop', ` stroke="url(#${id})"`) + ticks +

  g += `<rect class="d-block" x="${F1(hx - 15)}" y="${F1(hy - 40)}" width="30" height="24" rx="5"/><circle class="d-sheave" cx="${F1(hx)}" cy="${F1(hy - 28)}" r="5"/>`;
  g += `<line class="d-rope" x1="${F1(hx)}" y1="${F1(hy - 16)}" x2="${F1(hx)}" y2="${F1(hy - 5)}"/>`;
  pts.forEach((p, i) => { g += `<line class="d-leg" data-s="${o.ss[i]}" x1="${F1(hx)}" y1="${F1(hy)}" x2="${F1(p[0])}" y2="${F1(p[1])}"/>`; });

    }
    const rows = [];
    if (scaled) rows.push(['Forecast speed at 10 m', fmtQ('speed', st.v)]);
    if (vperm != null) {
      rows.push(['Wind limit for this lift', fmtQ('speed', vperm), s === 'ok' ? '' : s]);
      if (ratio != null && ratio > 1.2) rows.push(['Chart wind limit', fmtQ('speed', st.lim)]);
      rows.push(['Limit used', fmtPct(u, 0)]);
    }
    rows.push(['Beaufort force', `${bf.n}, ${T(bf.name)}`]);
    rows.push(['Wind pressure', S.units === 'imperial' ? withUnit(fmtN(q * 0.0208854, 1), 'psf') : withUnit(fmtN(q, 0), 'N/m\u00b2')]);
    if (Fw != null) rows.push(['Wind force on the load', S.units === 'imperial' ? withUnit(fmtN(Fw * 0.2248089, 0), 'lbf') : `${withUnit(fmtN(Fw / 1000, 2), 'kN')} (${withUnit(fmtN(Fw / G / 1000, 2), 't')})`]);
    if (swing != null) rows.push(['Load swing from the wind', fmtDeg(swing)]);
    if (ratio != null) rows.push(['Wind area per tonne', withUnit(fmtN(ratio, 2), 'm\u00b2/t') + ' (chart assumes 1.2)', ratio > 1.2 ? 'warn' : '']);

    return {

      lines: [`Wind ${fmtQ('speed', vt, 1)} at the boom tip${vperm != null ? `, limit for this lift ${fmtQ('speed', vperm, 1)}` : ''}`].concat(ratio != null ? [`Load area ${fmtQ('area', st.A)}, ${withUnit(fmtN(ratio, 2), 'm\u00b2/t')}`] : []),

  }
};

/* ===================== 7. Centre of gravity and load share ===================== */
function cgAuto(st) {

  const W = items.reduce((s, it) => s + it.w, 0);
  const xg = items.reduce((s, it) => s + it.w * it.x, 0) / W;
  let yg = null;
  if (st.useY && items.every(it => isNum(it.y))) yg = items.reduce((s, it) => s + it.w * it.y, 0) / W;
  return { W, xg, yg, n: items.length, items };
}
function cgSVG(o) {
  const xs = o.items.map(i => i.x).concat([o.xg, 0]);
  if (isNum(o.D)) xs.push(o.D);
  let lo = Math.min.apply(null, xs), hi = Math.max.apply(null, xs);
  if (hi - lo < 0.5) { lo -= 0.5; hi += 0.5; }
  const pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
  const k = 280 / (hi - lo), X = x => 20 + (x - lo) * k, by = 112;

  g += `<line class="d-beam" x1="${F1(X(lo + pad * 0.5))}" y1="${by}" x2="${F1(X(hi - pad * 0.5))}" y2="${by}"/>`;
  const wmax = Math.max.apply(null, o.items.map(i => i.w).concat([1e-9]));
  o.items.forEach((it, i) => {
    const sc = Math.sqrt(it.w / wmax), h = 14 + 44 * sc, w = 16 + 14 * sc;
    g += `<rect class="d-item" x="${F1(X(it.x) - w / 2)}" y="${F1(by - 3 - h)}" width="${F1(w)}" height="${F1(h)}" rx="3"/>` + tx(X(it.x), by - 3 - h / 2 + 4, String(it.i + 1), 'd-num', 'middle');
  });
  const cx = X(o.xg), left = cx > 210;
  g += `<line class="d-axis" x1="${F1(cx)}" y1="${by + 3}" x2="${F1(cx)}" y2="${by + 22}"/>` + cgMark(cx, by + 32, 9);
  g += tx(cx + (left ? -16 : 16), by + 37, 'CG ' + fmtQ('len', o.xg), 'd-strong', left ? 'end' : 'start');
  return `<svg class="dia" viewBox="0 0 320 156" role="img" aria-label="${esc(T('Load items and centre of gravity'))}">${g}</svg><figcaption>${esc(T('Side view. Numbers match your item list. Lift point A is at zero.'))}</figcaption>`;
}

['Keep sling angles above 45° from horizontal where you can. Never lift below 30°.', 'जहाँ हो सके, स्लिंग कोण क्षैतिज से 45° से ऊपर रखें। 30° से नीचे कभी लिफ्ट न करें।', 'முடிந்தவரை ஸ்லிங் கோணத்தைக் கிடைமட்டத்திலிருந்து 45° க்கு மேல் வையுங்கள். 30° க்குக் கீழே ஒருபோதும் தூக்க வேண்டாம்.'],

['Pack sharp edges. An unprotected edge can cut a sling well below its WLL.', 'नुकीले किनारों पर पैकिंग लगाएँ। खुला किनारा WLL से काफ़ी कम लोड पर भी स्लिंग काट सकता है।', 'கூர்மையான விளிம்புகளுக்குப் பேக்கிங் வையுங்கள். பாதுகாப்பில்லாத விளிம்பு WLL-ஐ விட மிகக் குறைந்த லோடிலேயே ஸ்லிங்கை வெட்டிவிடும்.'],

['Find the working radius, or the boom length you need to reach a spot.', 'काम का रेडियस निकालें, या किसी जगह तक पहुँचने के लिए ज़रूरी बूम लंबाई।', 'வேலை ரேடியஸைக் கண்டறியுங்கள், அல்லது ஒரு இடத்தை அடையத் தேவையான பூம் நீளத்தை.'],
['Working radius', 'काम का रेडियस', 'வேலை ரேடியஸ்'],
['Radius is measured from the centre of rotation to the hook, with the load hanging.', 'रेडियस घूमने के केंद्र से हुक तक नापा जाता है, लोड लटका हो तब।', 'லோடு தொங்கும் நிலையில், சுழற்சி மையத்திலிருந்து ஹுக் வரை ரேடியஸ் அளக்கப்படும்.'],
['The boom bends under load, so the real radius grows a little. Check the radius after taking the weight.', 'लोड से बूम झुकता है, इसलिए असली रेडियस थोड़ा बढ़ जाता है। वज़न उठाने के बाद रेडियस जाँचें।', 'லோடினால் பூம் வளையும், அதனால் உண்மையான ரேடியஸ் சற்று அதிகரிக்கும். எடையை எடுத்த பிறகு ரேடியஸைச் சரிபாருங்கள்.'],
['I want to find', 'मुझे निकालना है', 'நான் கண்டறிய வேண்டியது'],
['The radius', 'रेडियस', 'ரேடியஸ்'],
['The boom length', 'बूम की लंबाई', 'பூம் நீளம்'],
['Boom angle', 'बूम कोण', 'பூம் கோணம்'],
['Read it on the boom angle indicator or the LMI.', 'बूम एंगल इंडिकेटर या LMI पर देखें।', 'பூம் கோண காட்டி அல்லது LMI-இல் பாருங்கள்.'],
['Radius needed', 'ज़रूरी रेडियस', 'தேவையான ரேடியஸ்'],
['From the centre of rotation to where the load is set down.', 'घूमने के केंद्र से उस जगह तक जहाँ लोड रखना है।', 'சுழற்சி மையத்திலிருந்து லோடு இறக்கப்படும் இடம் வரை.'],
['Height needed at the boom tip', 'बूम टिप पर ज़रूरी ऊँचाई', 'பூம் முனையில் தேவையான உயரம்'],
['These are added up to get the tip height.', 'टिप की ऊँचाई के लिए इन्हें जोड़ा जाता है।', 'முனை உயரத்தைப் பெற இவை கூட்டப்படும்.'],
['Set-down height', 'रखने की जगह की ऊँचाई', 'இறக்கும் இட உயரம்'],
['Load height', 'लोड की ऊँचाई', 'லோடு உயரம்'],
['Rigging height', 'रिगिंग की ऊँचाई', 'ரிக்கிங் உயரம்'],
['Hook block and gap', 'हुक ब्लॉक और खाली जगह', 'ஹுக் பிளாக் மற்றும் இடைவெளி'],
['Set-down height is the top of the roof or platform. Rigging height is from the hook to the top of the load. Hook block and gap is the block height plus a safe gap under the boom tip.', 'रखने की ऊँचाई छत या प्लेटफ़ॉर्म का ऊपरी हिस्सा है। रिगिंग ऊँचाई हुक से लोड के ऊपर तक है। हुक ब्लॉक और खाली जगह यानी ब्लॉक की ऊँचाई और बूम टिप के नीचे सुरक्षित दूरी।', 'இறக்கும் உயரம் என்பது கூரை அல்லது தளத்தின் மேல் பகுதி. ரிக்கிங் உயரம் ஹுக்கிலிருந்து லோடின் மேல் வரை. ஹுக் பிளாக் மற்றும் இடைவெளி என்பது பிளாக் உயரமும் பூம் முனைக்குக் கீழே பாதுகாப்பான இடைவெளியும்.'],
['Crane measurements', 'क्रेन के नाप', 'கிரேன் அளவுகள்'],
['Optional. Leave them at 0 if you do not know them. They are in the crane manual.', 'वैकल्पिक। पता न हों तो 0 ही रहने दें। ये क्रेन मैनुअल में मिलेंगे।', 'விருப்பம். தெரியாவிட்டால் 0 ஆகவே விடுங்கள். இவை கிரேன் கையேட்டில் இருக்கும்.'],
['Boom foot offset', 'बूम फुट की दूरी', 'பூம் அடி விலகல்'],
['Boom foot height', 'बूम फुट की ऊँचाई', 'பூம் அடி உயரம்'],
['Offset is the flat distance from the centre of rotation to the boom foot pin. Use minus if the pin is behind it. Height is the pin height above the ground.', 'दूरी यानी घूमने के केंद्र से बूम फुट पिन तक क्षैतिज दूरी। पिन पीछे हो तो माइनस लगाएँ। ऊँचाई यानी ज़मीन से पिन की ऊँचाई।', 'விலகல் என்பது சுழற்சி மையத்திலிருந்து பூம் அடி பின் வரையிலான கிடைமட்ட தூரம். பின் பின்னால் இருந்தால் கழித்தல் குறி பயன்படுத்துங்கள். உயரம் என்பது தரையிலிருந்து பின்னின் உயரம்.'],
['Obstacle check', 'रुकावट जाँच', 'தடை சரிபார்ப்பு'],
['Optional. Checks that the boom clears a building, pipe rack or wall.', 'वैकल्पिक। जाँचता है कि बूम इमारत, पाइप रैक या दीवार से बचकर निकले।', 'விருப்பம். பூம் கட்டடம், பைப் ரேக் அல்லது சுவரைத் தொடாமல் கடக்கிறதா எனச் சரிபார்க்கும்.'],
['Distance to obstacle', 'रुकावट तक दूरी', 'தடை வரை தூரம்'],
['Obstacle height', 'रुकावट की ऊँचाई', 'தடை உயரம்'],
['Clearance you need', 'ज़रूरी खाली दूरी', 'தேவையான இடைவெளி'],
['Blank = 1 m', 'ख़ाली = 1 m', 'காலி = 1 m'],
['Blank = 3 ft', 'ख़ाली = 3 ft', 'காலி = 3 ft'],
['Distance is from the centre of rotation to the near edge of the obstacle.', 'दूरी घूमने के केंद्र से रुकावट के पास वाले किनारे तक।', 'தூரம் சுழற்சி மையத்திலிருந்து தடையின் அருகிலுள்ள விளிம்பு வரை.'],
['Enter the radius and the heights.', 'रेडियस और ऊँचाइयाँ लिखें।', 'ரேடியஸையும் உயரங்களையும் உள்ளிடுங்கள்.'],
['Enter the heights to work out the tip height.', 'टिप की ऊँचाई निकालने के लिए ऊँचाइयाँ लिखें।', 'முனை உயரத்தைக் கணக்கிட உயரங்களை உள்ளிடுங்கள்.'],
['The radius must be more than the boom foot offset.', 'रेडियस बूम फुट की दूरी से ज़्यादा होना चाहिए।', 'ரேடியஸ் பூம் அடி விலகலை விட அதிகமாக இருக்க வேண்டும்.'],
['The tip height needed is below the boom foot. Check the heights.', 'ज़रूरी टिप ऊँचाई बूम फुट से नीचे है। ऊँचाइयाँ जाँचें।', 'தேவையான முனை உயரம் பூம் அடிக்குக் கீழே உள்ளது. உயரங்களைச் சரிபாருங்கள்.'],
['Enter the boom length and the boom angle.', 'बूम की लंबाई और बूम कोण लिखें।', 'பூம் நீளத்தையும் பூம் கோணத்தையும் உள்ளிடுங்கள்.'],
['Boom length must be more than zero.', 'बूम की लंबाई शून्य से ज़्यादा होनी चाहिए।', 'பூம் நீளம் பூஜ்ஜியத்தை விட அதிகமாக இருக்க வேண்டும்.'],
['The boom angle must be between 0° and 90°.', 'बूम कोण 0° और 90° के बीच होना चाहिए।', 'பூம் கோணம் 0° முதல் 90° க்குள் இருக்க வேண்டும்.'],
['Use the next longer boom length your crane has, then check the chart at this radius.', 'आपकी क्रेन की अगली लंबी बूम लंबाई लें, फिर इस रेडियस पर चार्ट जाँचें।', 'உங்கள் கிரேனின் அடுத்த நீளமான பூம் நீளத்தைப் பயன்படுத்தி, இந்த ரேடியஸில் சார்ட்டைச் சரிபாருங்கள்.'],
['Check the load chart at this radius and boom length.', 'इस रेडियस और बूम लंबाई पर लोड चार्ट जाँचें।', 'இந்த ரேடியஸ் மற்றும் பூம் நீளத்தில் லோடு சார்ட்டைச் சரிபாருங்கள்.'],
['Very steep boom. Check the highest boom angle your crane allows.', 'बूम बहुत खड़ा है। जाँचें कि आपकी क्रेन में अधिकतम बूम कोण कितना है।', 'பூம் மிகச் செங்குத்தாக உள்ளது. உங்கள் கிரேன் அனுமதிக்கும் அதிகபட்ச பூம் கோணத்தைச் சரிபாருங்கள்.'],
['The obstacle is at or past the hook radius, so the boom does not pass over it.', 'रुकावट हुक रेडियस पर या उससे आगे है, इसलिए बूम उसके ऊपर से नहीं जाता।', 'தடை ஹுக் ரேடியஸிலோ அதற்கு அப்பாலோ உள்ளது, எனவே பூம் அதன் மேல் செல்லாது.'],
['The obstacle is behind the boom foot.', 'रुकावट बूम फुट के पीछे है।', 'தடை பூம் அடிக்குப் பின்னால் உள்ளது.'],
['The boom hits the obstacle. Move the crane or use a longer boom.', 'बूम रुकावट से टकराएगा। क्रेन की जगह बदलें या लंबा बूम लें।', 'பூம் தடையில் மோதும். கிரேனை நகர்த்துங்கள் அல்லது நீளமான பூம் பயன்படுத்துங்கள்.'],
['The boom clears the obstacle by less than the gap you need.', 'बूम रुकावट से ज़रूरी दूरी से कम फ़ासले पर निकलता है।', 'பூம் தேவையான இடைவெளியை விடக் குறைவான இடைவெளியில் தடையைக் கடக்கிறது.'],
['The boom clears the obstacle.', 'बूम रुकावट से बचकर निकलता है।', 'பூம் தடையைத் தொடாமல் கடக்கிறது.'],
['The boom clears the obstacle. Check the load chart at this radius and boom length.', 'बूम रुकावट से बचकर निकलता है। इस रेडियस और बूम लंबाई पर लोड चार्ट जाँचें।', 'பூம் தடையைத் தொடாமல் கடக்கிறது. இந்த ரேடியஸ் மற்றும் பூம் நீளத்தில் லோடு சார்ட்டைச் சரிபாருங்கள்.'],
['The boom clears the obstacle. Use the next longer boom length your crane has, then check the chart at this radius.', 'बूम रुकावट से बचकर निकलता है। आपकी क्रेन की अगली लंबी बूम लंबाई लें, फिर इस रेडियस पर चार्ट जाँचें।', 'பூம் தடையைத் தொடாமல் கடக்கிறது. உங்கள் கிரேனின் அடுத்த நீளமான பூம் நீளத்தைப் பயன்படுத்தி, இந்த ரேடியஸில் சார்ட்டைச் சரிபாருங்கள்.'],
['Tip height needed', 'ज़रूरी टिप ऊँचाई', 'தேவையான முனை உயரம்'],
['Boom tip height', 'बूम टिप की ऊँचाई', 'பூம் முனை உயரம்'],
['Boom height over the obstacle', 'रुकावट के ऊपर बूम की ऊँचाई', 'தடைக்கு மேல் பூம் உயரம்'],
['Clearance', 'खाली दूरी', 'இடைவெளி'],
['Clearance is measured to the centre line of the boom. Allow for half the boom depth and for boom bending.', 'खाली दूरी बूम की बीच वाली रेखा तक नापी जाती है। आधी बूम गहराई और बूम के झुकाव की गुंजाइश रखें।', 'இடைவெளி பூமின் மையக் கோடு வரை அளக்கப்படும். பூமின் பாதி ஆழத்தையும் பூம் வளைவையும் கணக்கில் கொள்ளுங்கள்.'],
['Boom foot offset and height are 0, so the tip height is measured from the boom foot.', 'बूम फुट की दूरी और ऊँचाई 0 हैं, इसलिए टिप की ऊँचाई बूम फुट से नापी गई है।', 'பூம் அடி விலகலும் உயரமும் 0, எனவே முனை உயரம் பூம் அடியிலிருந்து அளக்கப்பட்டது.'],
['Boom length needed', 'ज़रूरी बूम लंबाई', 'தேவையான பூம் நீளம்'],

['Radius {0} with {1} boom at {2}', 'रेडियस {0}, बूम {1}, कोण {2}', 'ரேடியஸ் {0}, பூம் {1}, கோணம் {2}'],

['Loose or soft ground', 'ढीली या नरम ज़मीन', 'தளர்வான அல்லது மென்மையான தரை'],
['Made ground or loose fill', 'भरी हुई या ढीली भराई वाली ज़मीन', 'நிரப்பிய அல்லது தளர்வான மண்'],

['Clear and start new', 'साफ़ करें और नया शुरू करें', 'அழித்து புதிதாகத் தொடங்கு'],
['New lift started', 'नई लिफ्ट शुरू हुई', 'புதிய லிஃப்ட் தொடங்கியது'],
['Changes the whole app, including the lift plan you share.', 'पूरा ऐप बदलता है, शेयर होने वाला लिफ्ट प्लान भी।', 'முழு செயலியையும் மாற்றும், நீங்கள் பகிரும் லிஃப்ட் திட்டம் உட்பட.'],
['Metric (t, m)', 'मीट्रिक (t, m)', 'மெட்ரிக் (t, m)'],
['Imperial (lb, ft)', 'इंपीरियल (lb, ft)', 'இம்பீரியல் (lb, ft)'],
['You can also switch units on any calculator.', 'आप किसी भी कैलकुलेटर पर इकाइयाँ बदल सकते हैं।', 'எந்தக் கணிப்பானிலும் அலகுகளை மாற்றலாம்.'],
['Theme', 'थीम', 'தீம்'],
['Auto', 'अपने-आप', 'தானியங்கி'],
['Light', 'हल्की', 'வெளிர்'],
['Dark', 'गहरी', 'இருண்ட'],
['Critical lift limit', 'क्रिटिकल लिफ्ट सीमा', 'முக்கியமான லிஃப்ட் வரம்பு'],
['Lifts above this share of the chart are flagged as critical. Use your company rule. The default is 75%.', 'चार्ट के इस हिस्से से ऊपर की लिफ्ट क्रिटिकल मानी जाती है। अपनी कंपनी का नियम लें। डिफ़ॉल्ट 75% है।', 'சார்ட்டின் இந்த அளவுக்கு மேற்பட்ட லிஃப்டுகள் முக்கியமானவை எனக் குறிக்கப்படும். உங்கள் நிறுவன விதியைப் பயன்படுத்துங்கள். இயல்புநிலை 75%.'],
['Install', 'इंस्टॉल', 'நிறுவு'],
['Put HookCalc on your home screen. It works without signal.', 'HookCalc को होम स्क्रीन पर रखें। यह बिना नेटवर्क भी चलता है।', 'HookCalc-ஐ முகப்புத் திரையில் வையுங்கள். இது சிக்னல் இல்லாமலும் இயங்கும்.'],
['Install app', 'ऐप इंस्टॉल करें', 'செயலியை நிறுவு'],
['Your data', 'आपका डेटा', 'உங்கள் தரவு'],
['Everything you enter stays on this device. Nothing you type is sent anywhere.', 'आप जो भी लिखते हैं, इसी डिवाइस पर रहता है। कुछ भी कहीं नहीं भेजा जाता।', 'நீங்கள் உள்ளிடும் அனைத்தும் இந்தச் சாதனத்திலேயே இருக்கும். எதுவும் எங்கும் அனுப்பப்படாது.'],
['Delete all data', 'सारा डेटा मिटाएँ', 'அனைத்து தரவையும் அழி'],
['About', 'जानकारी', 'பற்றி'],
['References: ASME B30.5 hand signals, EN 818-4 chain slings, EN 1492 sling colours, DIN 1054 ground values, FEM 5.016 wind method, OSHA 1926.1408 power line distances.', 'संदर्भ: ASME B30.5 हाथ के सिग्नल, EN 818-4 चेन स्लिंग, EN 1492 स्लिंग रंग, DIN 1054 ज़मीन के मान, FEM 5.016 हवा पद्धति, OSHA 1926.1408 बिजली लाइन दूरी।', 'மேற்கோள்கள்: ASME B30.5 கை சிக்னல்கள், EN 818-4 செயின் ஸ்லிங், EN 1492 ஸ்லிங் நிறங்கள், DIN 1054 தரை மதிப்புகள், FEM 5.016 காற்று முறை, OSHA 1926.1408 மின் கம்பி தூரங்கள்.'],
['Delete all data?', 'सारा डेटा मिटाएँ?', 'அனைத்து தரவையும் அழிக்கவா?'],
['This deletes every value, the lift plan and your settings from this device.', 'इससे इस डिवाइस से सारे मान, लिफ्ट प्लान और आपकी सेटिंग्स मिट जाएँगी।', 'இது இந்தச் சாதனத்திலிருந்து அனைத்து மதிப்புகள், லிஃப்ட் திட்டம், உங்கள் அமைப்புகளை அழிக்கும்.'],
['Delete everything', 'सब मिटाएँ', 'அனைத்தையும் அழி'],
['All data deleted', 'सारा डेटा मिट गया', 'அனைத்து தரவும் அழிக்கப்பட்டது'],
['Welcome to HookCalc', 'HookCalc में स्वागत है', 'HookCalc-க்கு வரவேற்கிறோம்'],
['Crane and rigging numbers in one place: capacity, slings, ground pressure, wind, and a lift plan you can share.', 'क्रेन और रिगिंग की गणना एक जगह: क्षमता, स्लिंग, ज़मीन का दबाव, हवा, और शेयर करने लायक लिफ्ट प्लान।', 'கிரேன் மற்றும் ரிக்கிங் கணக்குகள் ஒரே இடத்தில்: திறன், ஸ்லிங், தரை அழுத்தம், காற்று, பகிரக்கூடிய லிஃப்ட் திட்டம்.'],
['Your units', 'आपकी इकाइयाँ', 'உங்கள் அலகுகள்'],
['I understand, start', 'मैं समझ गया, शुरू करें', 'புரிந்தது, தொடங்கு'],
['Skip to content', 'मुख्य सामग्री पर जाएँ', 'உள்ளடக்கத்திற்குச் செல்'],
['Hand signals', 'हाथ के सिग्नल', 'கை சிக்னல்கள்'],
['Crane hand signals', 'क्रेन के हाथ सिग्नल', 'கிரேன் கை சிக்னல்கள்'],
['Standard hand signals for mobile cranes (ASME B30.5). Agree the signals with the operator before the lift. Only the appointed signaller gives signals, but anyone can give the emergency stop.', 'मोबाइल क्रेन के मानक हाथ सिग्नल (ASME B30.5)। लिफ्ट से पहले ऑपरेटर के साथ सिग्नल तय करें। सिग्नल सिर्फ़ तय सिग्नलमैन देगा, लेकिन आपातकालीन स्टॉप कोई भी दे सकता है।', 'மொபைல் கிரேன்களுக்கான நிலையான கை சிக்னல்கள் (ASME B30.5). லிஃப்டுக்கு முன் ஆபரேட்டருடன் சிக்னல்களை ஒப்புக்கொள்ளுங்கள். நியமிக்கப்பட்ட சிக்னல்மேன் மட்டுமே சிக்னல் கொடுப்பார், ஆனால் அவசர நிறுத்தத்தை யார் வேண்டுமானாலும் கொடுக்கலாம்.'],
['Hoist', 'होइस्ट (ऊपर उठाएँ)', 'ஹாய்ஸ்ட் (மேலே தூக்கு)'],
['Forearm vertical, forefinger pointing up. Move the hand in small horizontal circles.', 'बाँह का निचला हिस्सा सीधा खड़ा, तर्जनी ऊपर की ओर। हाथ को छोटे आड़े गोलों में घुमाएँ।', 'முன்கை செங்குத்தாக, ஆள்காட்டி விரல் மேல்நோக்கி. கையைச் சிறிய கிடைமட்ட வட்டங்களில் சுழற்றுங்கள்.'],
['Lower', 'लोअर (नीचे करें)', 'லோயர் (கீழே இறக்கு)'],
['Arm extended down, forefinger pointing down. Move the hand in small horizontal circles.', 'बाँह नीचे की ओर फैली, तर्जनी नीचे की ओर। हाथ को छोटे आड़े गोलों में घुमाएँ।', 'கை கீழ்நோக்கி நீட்டி, ஆள்காட்டி விரல் கீழ்நோக்கி. கையைச் சிறிய கிடைமட்ட வட்டங்களில் சுழற்றுங்கள்.'],
['Use main hoist', 'मेन होइस्ट चलाएँ', 'மெயின் ஹாய்ஸ்ட் பயன்படுத்து'],
['Tap your fist on your head, then use the regular signals.', 'मुट्ठी से अपने सिर पर थपकी दें, फिर सामान्य सिग्नल दें।', 'முஷ்டியால் தலையில் தட்டி, பிறகு வழக்கமான சிக்னல்களைக் கொடுங்கள்.'],
['Use whipline (auxiliary hoist)', 'व्हिपलाइन चलाएँ (सहायक होइस्ट)', 'விப்லைன் பயன்படுத்து (துணை ஹாய்ஸ்ட்)'],
['Tap your elbow with one hand, then use the regular signals.', 'एक हाथ से अपनी कोहनी थपथपाएँ, फिर सामान्य सिग्नल दें।', 'ஒரு கையால் முழங்கையைத் தட்டி, பிறகு வழக்கமான சிக்னல்களைக் கொடுங்கள்.'],
['Raise boom', 'बूम ऊपर करें', 'பூமை உயர்த்து'],
['Arm extended, fingers closed, thumb pointing up.', 'बाँह फैली, उँगलियाँ बंद, अँगूठा ऊपर की ओर।', 'கை நீட்டி, விரல்கள் மூடி, கட்டைவிரல் மேல்நோக்கி.'],
['Lower boom', 'बूम नीचे करें', 'பூமை இறக்கு'],
['Arm extended, fingers closed, thumb pointing down.', 'बाँह फैली, उँगलियाँ बंद, अँगूठा नीचे की ओर।', 'கை நீட்டி, விரல்கள் மூடி, கட்டைவிரல் கீழ்நோக்கி.'],
['Move slowly', 'धीरे चलाएँ', 'மெதுவாக நகர்த்து'],
['Give the motion signal with one hand. Hold the other hand still in front of it.', 'एक हाथ से चलाने का सिग्नल दें। दूसरा हाथ उसके सामने स्थिर रखें।', 'ஒரு கையால் இயக்க சிக்னல் கொடுங்கள். மற்றொரு கையை அதன் முன் அசையாமல் வையுங்கள்.'],
['Raise boom and lower load', 'बूम ऊपर, लोड नीचे', 'பூம் உயர்த்தி லோடை இறக்கு'],
['Arm extended, thumb pointing up. Open and close the fingers for as long as the load should move.', 'बाँह फैली, अँगूठा ऊपर। जब तक लोड को चलना है, उँगलियाँ खोलते-बंद करते रहें।', 'கை நீட்டி, கட்டைவிரல் மேல்நோக்கி. லோடு நகர வேண்டிய வரை விரல்களைத் திறந்து மூடுங்கள்.'],
['Lower boom and raise load', 'बूम नीचे, लोड ऊपर', 'பூம் இறக்கி லோடை உயர்த்து'],
['Arm extended, thumb pointing down. Open and close the fingers for as long as the load should move.', 'बाँह फैली, अँगूठा नीचे। जब तक लोड को चलना है, उँगलियाँ खोलते-बंद करते रहें।', 'கை நீட்டி, கட்டைவிரல் கீழ்நோக்கி. லோடு நகர வேண்டிய வரை விரல்களைத் திறந்து மூடுங்கள்.'],
['Swing', 'घुमाएँ (स्विंग)', 'சுழற்று (ஸ்விங்)'],
['Arm extended. Point with a finger in the direction the boom should swing.', 'बाँह फैली। जिस दिशा में बूम घूमना है, उँगली से उधर इशारा करें।', 'கை நீட்டி. பூம் சுழல வேண்டிய திசையில் விரலால் காட்டுங்கள்.'],
['Arm extended, palm down. Move the arm back and forth horizontally.', 'बाँह फैली, हथेली नीचे। बाँह को आड़े आगे-पीछे हिलाएँ।', 'கை நீட்டி, உள்ளங்கை கீழ்நோக்கி. கையைக் கிடைமட்டமாக முன்னும் பின்னும் அசையுங்கள்.'],
['Emergency stop', 'आपातकालीन स्टॉप', 'அவசர நிறுத்தம்'],
['Both arms extended, palms down. Move both arms back and forth horizontally.', 'दोनों बाँहें फैली, हथेलियाँ नीचे। दोनों बाँहों को आड़े आगे-पीछे हिलाएँ।', 'இரு கைகளும் நீட்டி, உள்ளங்கைகள் கீழ்நோக்கி. இரு கைகளையும் கிடைமட்டமாக முன்னும் பின்னும் அசையுங்கள்.'],
['Dog everything', 'सब कुछ रोकें (डॉग एवरीथिंग)', 'அனைத்தையும் பூட்டு (டாக் எவ்ரிதிங்)'],
['Clasp your hands in front of your body.', 'शरीर के सामने दोनों हाथ जोड़कर पकड़ें।', 'உடலின் முன் இரு கைகளையும் கோர்த்துப் பிடியுங்கள்.'],
['Travel', 'चलाएँ (ट्रैवल)', 'நகர்த்து (டிராவல்)'],
['Arm extended forward, hand open and slightly raised. Make a pushing motion in the direction of travel.', 'बाँह आगे फैली, हाथ खुला और थोड़ा ऊपर। चलने की दिशा में धकेलने का इशारा करें।', 'கை முன்னோக்கி நீட்டி, உள்ளங்கை திறந்து சற்று உயர்த்தி. நகர வேண்டிய திசையில் தள்ளும் அசைவு செய்யுங்கள்.'],
['Travel, both tracks (crawler)', 'दोनों ट्रैक से चलाएँ (क्रॉलर)', 'இரு டிராக்குகளிலும் நகர்த்து (கிராலர்)'],
['Both fists in front of the body, circling each other. Forward or backward shows the direction.', 'दोनों मुट्ठियाँ शरीर के सामने, एक-दूसरे के चारों ओर घुमाएँ। आगे या पीछे घुमाना दिशा बताता है।', 'இரு முஷ்டிகளும் உடலின் முன், ஒன்றையொன்று சுற்றி. முன்னோ பின்னோ சுற்றுவது திசையைக் காட்டும்.'],
['Travel, one track (crawler)', 'एक ट्रैक से चलाएँ (क्रॉलर)', 'ஒரு டிராக்கில் நகர்த்து (கிராலர்)'],
['Raise one fist to lock that track. Circle the other fist vertically in front of the body to travel the other track.', 'जिस ट्रैक को लॉक करना है, उस तरफ़ की मुट्ठी ऊपर उठाएँ। दूसरे ट्रैक को चलाने के लिए दूसरी मुट्ठी शरीर के सामने खड़े गोले में घुमाएँ।', 'அந்த டிராக்கைப் பூட்ட ஒரு முஷ்டியை உயர்த்துங்கள். மற்ற டிராக்கை நகர்த்த மற்றொரு முஷ்டியை உடலின் முன் செங்குத்து வட்டமாகச் சுற்றுங்கள்.'],
['Extend boom (telescopic)', 'बूम बाहर निकालें (टेलीस्कोपिक)', 'பூமை நீட்டு (டெலஸ்கோப்பிக்)'],
['Both fists in front of the body, thumbs pointing outward.', 'दोनों मुट्ठियाँ शरीर के सामने, अँगूठे बाहर की ओर।', 'இரு முஷ்டிகளும் உடலின் முன், கட்டைவிரல்கள் வெளிநோக்கி.'],
['Retract boom (telescopic)', 'बूम अंदर करें (टेलीस्कोपिक)', 'பூமைச் சுருக்கு (டெலஸ்கோப்பிக்)'],
['Both fists in front of the body, thumbs pointing toward each other.', 'दोनों मुट्ठियाँ शरीर के सामने, अँगूठे एक-दूसरे की ओर।', 'இரு முஷ்டிகளும் உடலின் முன், கட்டைவிரல்கள் ஒன்றையொன்று நோக்கி.'],
['Extend boom, one hand', 'बूम बाहर निकालें, एक हाथ से', 'பூமை நீட்டு, ஒரு கையால்'],
['One fist in front of the chest, thumb tapping the chest.', 'एक मुट्ठी छाती के सामने, अँगूठे से छाती थपथपाएँ।', 'ஒரு முஷ்டி மார்பின் முன், கட்டைவிரலால் மார்பைத் தட்டுங்கள்.'],
['Retract boom, one hand', 'बूम अंदर करें, एक हाथ से', 'பூமைச் சுருக்கு, ஒரு கையால்'],
['One fist in front of the chest, thumb pointing outward, heel of the fist tapping the chest.', 'एक मुट्ठी छाती के सामने, अँगूठा बाहर की ओर, मुट्ठी के निचले हिस्से से छाती थपथपाएँ।', 'ஒரு முஷ்டி மார்பின் முன், கட்டைவிரல் வெளிநோக்கி, முஷ்டியின் அடிப்பகுதியால் மார்பைத் தட்டுங்கள்.'],
['Sling angles', 'स्लिंग कोण', 'ஸ்லிங் கோணங்கள்'],
['Sling angle factors', 'स्लिंग कोण गुणक', 'ஸ்லிங் கோணக் காரணிகள்'],
['The lower the sling angle, the higher the tension in each leg. Leg tension = load ÷ number of legs × factor. The last column is for a 2-leg sling lifting {0}.', 'स्लिंग कोण जितना कम, हर लेग में तनाव उतना ज़्यादा। लेग तनाव = लोड ÷ लेग की संख्या × गुणक। आख़िरी कॉलम {0} उठाती 2-लेग स्लिंग के लिए है।', 'ஸ்லிங் கோணம் குறையக் குறைய ஒவ்வொரு லெக்கிலும் இழுவிசை அதிகரிக்கும். லெக் இழுவிசை = லோடு ÷ லெக்குகளின் எண்ணிக்கை × காரணி. கடைசி நெடுவரிசை {0} தூக்கும் 2-லெக் ஸ்லிங்கிற்கானது.'],
['Factor', 'गुणक', 'காரணி'],
['Each leg', 'हर लेग', 'ஒவ்வொரு லெக்'],
['Keep sling angles above 45° where you can. Below 30°, do not lift.', 'जहाँ हो सके, स्लिंग कोण 45° से ऊपर रखें। 30° से नीचे लिफ्ट न करें।', 'முடிந்தவரை ஸ்லிங் கோணங்களை 45° க்கு மேல் வையுங்கள். 30° க்குக் கீழே தூக்க வேண்டாம்.'],
['Hitches', 'हिच', 'ஹிட்ச்கள்'],
['Hitch types and capacity', 'हिच के प्रकार और क्षमता', 'ஹிட்ச் வகைகள் மற்றும் திறன்'],
['Capacity', 'क्षमता', 'திறன்'],
['Straight (vertical)', 'सीधा (ऊर्ध्वाधर)', 'நேரடி (செங்குத்து)'],
['Choker, choke angle 120° or more', 'चोकर, चोक कोण 120° या ज़्यादा', 'சோக்கர், சோக் கோணம் 120° அல்லது அதிகம்'],
['Basket, legs vertical', 'बास्केट, लेग सीधे खड़े', 'பாஸ்கெட், லெக்குகள் செங்குத்தாக'],
['Basket, legs at 60°', 'बास्केट, लेग 60° पर', 'பாஸ்கெட், லெக்குகள் 60°'],
['Basket, legs at 45°', 'बास्केट, लेग 45° पर', 'பாஸ்கெட், லெக்குகள் 45°'],
['Basket, legs at 30°', 'बास्केट, लेग 30° पर', 'பாஸ்கெட், லெக்குகள் 30°'],
['Angles are from horizontal. Bending wire rope around a small diameter lowers its capacity further. The sling tag and the maker’s table come first.', 'कोण क्षैतिज से हैं। वायर रोप को छोटे व्यास पर मोड़ने से उसकी क्षमता और घटती है। स्लिंग टैग और निर्माता की टेबल पहले हैं।', 'கோணங்கள் கிடைமட்டத்திலிருந்து. வயர் ரோப்பைச் சிறிய விட்டத்தில் வளைத்தால் திறன் மேலும் குறையும். ஸ்லிங் டேக்கும் உற்பத்தியாளர் அட்டவணையுமே முதன்மை.'],
['Sling colours', 'स्लिंग के रंग', 'ஸ்லிங் நிறங்கள்'],
['Sling colour code', 'स्लिंग रंग कोड', 'ஸ்லிங் நிறக் குறியீடு'],
['Colour code for flat webbing slings and roundslings to EN 1492. WLL for a straight lift.', 'EN 1492 के अनुसार फ्लैट वेबिंग स्लिंग और राउंड स्लिंग का रंग कोड। सीधी लिफ्ट का WLL।', 'EN 1492 படி தட்டை வெப்பிங் ஸ்லிங் மற்றும் ரவுண்ட் ஸ்லிங்கின் நிறக் குறியீடு. நேரடி லிஃப்ட் WLL.'],
['Colour', 'रंग', 'நிறம்'],

['10 t and over', '10 t और ज़्यादा', '10 t மற்றும் அதற்கு மேல்'],
['Always read the label. Other standards, such as US WSTDA, use different colours. Never use a sling with a missing or unreadable label.', 'हमेशा लेबल पढ़ें। दूसरे मानक, जैसे US WSTDA, अलग रंग इस्तेमाल करते हैं। बिना लेबल या न पढ़े जा सकने वाले लेबल की स्लिंग कभी न लगाएँ।', 'எப்போதும் லேபிளைப் படியுங்கள். US WSTDA போன்ற பிற தரநிலைகள் வேறு நிறங்களைப் பயன்படுத்தும். லேபிள் இல்லாத அல்லது படிக்க முடியாத ஸ்லிங்கை ஒருபோதும் பயன்படுத்த வேண்டாம்.'],
['Chain WLL', 'चेन WLL', 'செயின் WLL'],
['Grade 80 chain slings', 'ग्रेड 80 चेन स्लिंग', 'கிரேடு 80 செயின் ஸ்லிங்'],
['WLL in tonnes for grade 80 chain slings to EN 818-4. Angles here are measured from the vertical.', 'EN 818-4 के अनुसार ग्रेड 80 चेन स्लिंग का WLL टन में। यहाँ कोण ऊर्ध्वाधर से नापे गए हैं।', 'EN 818-4 படி கிரேடு 80 செயின் ஸ்லிங்கின் WLL டன்னில். இங்கு கோணங்கள் செங்குத்திலிருந்து அளக்கப்பட்டவை.'],
['Chain', 'चेन', 'செயின்'],
['1 leg', '1 लेग', '1 லெக்'],
['2 legs 0–45°', '2 लेग 0–45°', '2 லெக் 0–45°'],
['2 legs 45–60°', '2 लेग 45–60°', '2 லெக் 45–60°'],
['3–4 legs 0–45°', '3–4 लेग 0–45°', '3–4 லெக் 0–45°'],
['3–4 legs 45–60°', '3–4 लेग 45–60°', '3–4 லெக் 45–60°'],
['Over 60° from vertical, do not use. Choke hitch: ×0.8. Grade 100 chain is stronger: use its own tag.', 'ऊर्ध्वाधर से 60° से ज़्यादा पर इस्तेमाल न करें। चोक हिच: ×0.8। ग्रेड 100 चेन ज़्यादा मज़बूत है: उसका अपना टैग देखें।', 'செங்குத்திலிருந்து 60° க்கு மேல் பயன்படுத்த வேண்டாம். சோக் ஹிட்ச்: ×0.8. கிரேடு 100 செயின் வலிமையானது: அதன் சொந்த டேக்கைப் பாருங்கள்.'],
['Shackles', 'शैकल', 'ஷேக்கிள்கள்'],
['Shackle WLL', 'शैकल WLL', 'ஷேக்கிள் WLL'],
['Typical WLL of grade S bow shackles with screw or bolt pins.', 'स्क्रू या बोल्ट पिन वाले ग्रेड S बो शैकल का सामान्य WLL।', 'ஸ்க்ரூ அல்லது போல்ட் பின் கொண்ட கிரேடு S போ ஷேக்கிள்களின் வழக்கமான WLL.'],
['Nominal size', 'नाममात्र आकार', 'பெயரளவு அளவு'],
['Always use the WLL marked on the shackle. Side loading lowers the WLL.', 'हमेशा शैकल पर लिखा WLL इस्तेमाल करें। साइड से लोड पड़ने पर WLL घटता है।', 'எப்போதும் ஷேக்கிளில் குறிக்கப்பட்ட WLL-ஐப் பயன்படுத்துங்கள். பக்கவாட்டு லோடு WLL-ஐக் குறைக்கும்.'],
['Load charts', 'लोड चार्ट', 'லோடு சார்ட்டுகள்'],
['Reading a load chart', 'लोड चार्ट कैसे पढ़ें', 'லோடு சார்ட்டைப் படிப்பது எப்படி'],
['Pick the chart for the exact set-up: counterweight, outrigger spread, on outriggers or on tyres, and working area (360°, over the side or over the rear).', 'ठीक उसी सेट-अप का चार्ट चुनें: काउंटरवेट, आउटरिगर फैलाव, आउटरिगर पर या टायर पर, और काम का क्षेत्र (360°, साइड या पीछे)।', 'சரியான அமைப்பிற்கான சார்ட்டைத் தேர்ந்தெடுங்கள்: கவுண்டர்வெயிட், அவுட்ரிகர் விரிப்பு, அவுட்ரிகரிலா டயரிலா, வேலைப் பகுதி (360°, பக்கவாட்டு அல்லது பின்புறம்).'],
['Radius is from the centre of rotation to the hook, with the load hanging. Measure it; do not guess.', 'रेडियस घूमने के केंद्र से हुक तक है, लोड लटका हो तब। नापें, अंदाज़ा न लगाएँ।', 'லோடு தொங்கும் நிலையில் சுழற்சி மையத்திலிருந்து ஹுக் வரை ரேடியஸ். அளவிடுங்கள்; ஊகிக்க வேண்டாம்.'],
['If the radius falls between two columns, use the larger radius. If the boom length falls between two rows, use the lower capacity.', 'अगर रेडियस दो कॉलम के बीच है, तो बड़ा रेडियस लें। अगर बूम लंबाई दो पंक्तियों के बीच है, तो कम क्षमता लें।', 'ரேடியஸ் இரண்டு நெடுவரிசைகளுக்கு இடையில் இருந்தால் பெரிய ரேடியஸைப் பயன்படுத்துங்கள். பூம் நீளம் இரண்டு வரிசைகளுக்கு இடையில் இருந்தால் குறைந்த திறனைப் பயன்படுத்துங்கள்.'],
['Deduct the hook block, slings, shackles and spreader, and any jib or extension the chart says to deduct.', 'हुक ब्लॉक, स्लिंग, शैकल और स्प्रेडर घटाएँ, और कोई भी जिब या एक्सटेंशन जो चार्ट घटाने को कहे।', 'ஹுக் பிளாக், ஸ்லிங், ஷேக்கிள், ஸ்ப்ரெடர், மற்றும் சார்ட் கழிக்கச் சொல்லும் ஜிப் அல்லது நீட்டிப்பைக் கழியுங்கள்.'],
['Capacities in bold or shaded parts of the chart are often limited by strength, not tipping. The crane can fail before it tips.', 'चार्ट के बोल्ड या छायांकित हिस्से की क्षमता अक्सर मज़बूती से सीमित होती है, पलटने से नहीं। क्रेन पलटने से पहले टूट सकती है।', 'சார்ட்டின் தடித்த அல்லது நிழலிட்ட பகுதியிலுள்ள திறன்கள் பெரும்பாலும் வலிமையால் வரம்பிடப்படும், கவிழ்வால் அல்ல. கிரேன் கவிழும் முன்பே உடையலாம்.'],
['Check the parts of line and the line pull for the load.', 'लोड के लिए लाइन पार्ट्स और लाइन पुल जाँचें।', 'லோடுக்கான லைன் பார்ட்களையும் லைன் இழுப்பையும் சரிபாருங்கள்.'],
['Lifts over {0}% of the chart are flagged as critical. Set your company limit in Settings.', 'चार्ट के {0}% से ऊपर की लिफ्ट क्रिटिकल मानी जाती है। अपनी कंपनी की सीमा सेटिंग्स में डालें।', 'சார்ட்டின் {0}% க்கு மேற்பட்ட லிஃப்டுகள் முக்கியமானவை எனக் குறிக்கப்படும். உங்கள் நிறுவன வரம்பை அமைப்புகளில் வையுங்கள்.'],
['The LMI is a safety backup. Never use it to find the limit.', 'LMI सिर्फ़ सुरक्षा के लिए बैकअप है। सीमा खोजने के लिए कभी इसका इस्तेमाल न करें।', 'LMI ஒரு பாதுகாப்பு காப்பு மட்டுமே. வரம்பைக் கண்டறிய ஒருபோதும் அதைப் பயன்படுத்த வேண்டாம்.'],

/* ---------- home ---------- */
function qcField(k, label) {
  const st = S.tools.cap, u = unitOf('mass');
  return `<div class="fld qf"><label for="qc-${k}">${esc(T(label))}<span class="vh"> (${esc(u)})</span></label><div class="inp inp-dark"><input id="qc-${k}" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off" spellcheck="false" data-qc="${k}" placeholder="${esc(T('e.g.'))} ${exNum('mass', k === 'load' ? 8000 : 14200)}" value="${esc(dispVal('mass', st[k]))}"><span class="u" aria-hidden="true">${esc(u)}</span></div><p class="errmsg" hidden></p></div>`;
}
function toolRow(id) {
  const t = TOOLS[id];
  let chip = '';
  if (!t.noPlan && !S.ex[id]) {
    const r = runCalc(id);
    if (r.state === 'ok') chip = `<span class="chip" data-s="${r.status || 'info'}">${esc(withUnit(T(r.main.value), T(r.main.unit)))}</span>`;
  }
  return `<a class="trow" data-id="${id}" href="#/t/${id}"><span class="ticon">${IC[t.icon]}</span><span class="tbody"><span class="tname">${esc(T(t.title))}</span><span class="tdesc">${esc(T(t.short))}</span></span>${chip}</a>`;
}
function renderHome(v) {
  v.innerHTML = '<section class="hero"><div class="hero-in">' +
    `<div class="hero-copy"><h1>${esc(T('Check the lift before you lift.'))}</h1><p>${esc(T('Crane capacity, sling loads, ground pressure and wind, with a lift plan you can share. Works without signal once it is open.'))}</p>` +
    `<a class="btn btn-primary btn-lg" href="#/plan">${IC.plan}<span>${esc(T('Make a lift plan'))}</span></a></div>` +
    `<div class="qc" role="group" aria-labelledby="qc-h"><div class="qc-top"><h2 id="qc-h">${esc(T('Quick capacity check'))}</h2><a class="qc-link" href="#/t/cap">${esc(T('Full check'))}</a></div>` +
    `<div class="qc-in">${qcField('load', 'Load weight')}${qcField('cap', 'Chart capacity')}</div><div class="qc-out" id="qc-out"></div></div>` +
    '</div></section>' +
    `<div class="page home"><section class="hsec"><h2 class="hsec-h">${esc(T('Calculators'))}</h2><div class="tlist">${TOOL_ORDER.map(toolRow).join('')}</div></section>` +
    `<section class="hsec"><h2 class="hsec-h">${esc(T('Field guide'))}</h2><div class="glinks">${GUIDE.map(g => `<a class="glink" href="#/guide/${g.id}">${esc(T(g.short))}</a>`).join('')}</div></section>` +
    `<p class="foot">${esc(T(DISCLAIMER))}</p></div>`;
  updateQC(true);
}
function updateQC(first) {
  const box = $('#qc-out'); if (!box) return;
  const st = S.tools.cap, r = runCalc('cap'), ok = r.state === 'ok';
  const s = ok ? r.status : r.state;
  const p = ok ? r.pct : 0;
  const ded = (st.rig || 0) + (st.block || 0) + (st.other || 0);
  if (first || !$('.qc-g', box)) {
    box.innerHTML = `<div class="qc-g">${gaugeSVG(p)}</div><div class="qc-num"><span class="ro-num" id="qc-num"></span><span class="ro-unit">%</span></div><p class="ro-verdict" id="qc-v"></p><p class="qc-note" id="qc-note"></p>`;
  } else patchGauge(box, p);
  box.setAttribute('data-s', s);
  $('#qc-num').textContent = ok ? r.main.value : '\u2014';
  $('#qc-v').innerHTML = `${SIC[s] || ''}<span>${esc(T(ok ? r.verdict : 'Enter both weights to see the capacity used.'))}</span>`;
  $('#qc-note').textContent = ok ? (ded > 0 ? TF('Includes {0} for hook block, rigging and other deductions.', fmtQ('mass', ded)) : T('Hook block and rigging are not added yet. Add them in the full check.')) : '';
}
function onQuickInput(el) {
  const k = el.getAttribute('data-qc');
  const r = readNum(el.value, 'mass', false);
  S.tools.cap[k] = r.v;
  setErr(el, r.err);
  touched('cap');
  updateQC(false);
  const row = $('.trow[data-id="cap"]');
  if (row) row.outerHTML = toolRow('cap');
}

function todayISO() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  if (isNaN(d.getTime())) return iso;
  try { return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); } catch (e) { return iso; }
}

    bad: 'Needs an engineered lift plan and senior approval.',

function planText() {
  const p = S.plan, ps = planStatus();
  const L = ['\ud83c\udfd7\ufe0f ' + T('Lift plan')];
  [['Job', p.job], ['Customer', p.customer], ['Site', p.site], ['Date', fmtDate(p.date)], ['Crane', p.crane], ['Operator', p.operator], ['Rigger or signaller', p.rigger]]
    .forEach(kv => { if (kv[1] && String(kv[1]).trim()) L.push(`${T(kv[0])}: ${String(kv[1]).trim()}`); });
  L.push('', `${EMOJI[ps.s]} ${T('Lift category')}: ${T(PLAN_CAT[ps.s])}`);
  ps.inc.forEach(x => {
    const r = x.r;
    L.push('', `${EMOJI[r.status || 'info']} ${T(TOOLS[x.id].title)}: ${withUnit(T(r.main.value), T(r.main.unit))}`);
    if (r.verdict) L.push(T(r.verdict));
    (r.lines || []).forEach(l => L.push('\u2022 ' + T(l)));
  });
  L.push('', TF('Checklist: {0} of {1} done', ps.done, CHECK_COUNT));
  CHECKS.forEach(g => g.items.forEach(i => L.push(`${S.plan.chk[i[0]] ? '\u2611' : '\u2610'} ${T(i[1])}`)));
  if (p.notes && p.notes.trim()) L.push('', T('Notes') + ':', p.notes.trim());
  L.push('', T(SHARE_FOOT));
  return L.join('\n').replace(/\u00a0/g, ' ');
}

ACTS['plan-new'] = () => confirmBox('Start a new lift?', 'This clears every calculator, the job details, notes and the checklist. Crane and crew names are kept. Settings stay as they are.', 'Clear and start new', () => {

}

  applyTheme(); applyLang(); buildChrome(); flushSave(); render(false); toast('All data deleted');
}, true);
ACTS.lang = () => openModal({ kind: 'lang', title: 'Language', body: `<p class="lbl">Language \u00b7 \u092d\u093e\u0937\u093e \u00b7 \u0bae\u0bca\u0bb4\u0bbf</p>${gseg('lang', LANGS, 'Language')}`, actions: [{ label: 'Close', cls: 'btn-quiet' }] });

/* ---------- first launch ---------- */
function showOnboarding() {
  openModal({
    kind: 'onboard',
    title: 'Welcome to HookCalc',
    body: `<p class="lbl">Language \u00b7 \u092d\u093e\u0937\u093e \u00b7 \u0bae\u0bca\u0bb4\u0bbf</p>${gseg('lang', LANGS, 'Language')}` +
      `<p style="margin-top:16px">${esc(T('Crane and rigging numbers in one place: capacity, slings, ground pressure, wind, and a lift plan you can share.'))}</p>` +
      `<p class="lbl">${esc(T('Your units'))}</p>${gseg('units', [['metric', 'Metric (t, m)'], ['imperial', 'Imperial (lb, ft)']], 'Units')}` +
      `<p class="m-warn">${SIC.warn}<span>${esc(T(DISCLAIMER))}</span></p>`,
    actions: [{ label: 'I understand, start', cls: 'btn-primary', onClick: () => { S.onboarded = true; save(); } }],
    dismiss: false
  });
}

/* ---------- start ---------- */
function init() {
  S = loadState();
  initI18n();
  applyTheme();
  applyLang();
  buildChrome();
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', onKey);
  window.addEventListener('hashchange', () => render(false));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSave(); });
  window.addEventListener('pagehide', flushSave);
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (VIEW.name === 'settings') render(true); });
  render(false);
  if (!S.onboarded) showOnboarding();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

})();</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
